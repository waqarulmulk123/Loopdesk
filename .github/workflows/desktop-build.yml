name: Desktop build (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-m0:
    name: M0 Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build .NET Core library
        run: dotnet build src/desktop/LiveWallpaperStudio.Core/LiveWallpaperStudio.Core.csproj -c Release

      - name: Run .NET tests
        run: dotnet run --project tests/Core.Tests/Core.Tests.csproj -c Release

      - name: Configure native renderer (CMake)
        run: cmake -S src/renderer -B build/renderer -DCMAKE_BUILD_TYPE=Release

      - name: Build native renderer
        run: cmake --build build/renderer --config Release

      - name: Run native renderer (M0 startup proof)
        run: .\build\renderer\Release\lws-renderer.exe

      - name: Build WinUI app (unpackaged, x64)
        run: dotnet build src/desktop/LiveWallpaperStudio.App/LiveWallpaperStudio.App.csproj -c Release -p:Platform=x64

      - name: Create Microsoft Store MSIX
        shell: pwsh
        run: |
          $storePackage = Join-Path $env:GITHUB_WORKSPACE "artifacts\store\"
          msbuild src\desktop\LiveWallpaperStudio.App\LiveWallpaperStudio.App.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir=$storePackage /p:AppxPackageSigningEnabled=false

      - name: Create unsigned Windows QA package
        shell: pwsh
        run: |
          $publish = "artifacts\desktop\win-x64"
          dotnet publish src/desktop/LiveWallpaperStudio.App/LiveWallpaperStudio.App.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o $publish
          Copy-Item .\build\renderer\Release\lws-renderer.exe -Destination $publish -Force
          Compress-Archive -Path "$publish\*" -DestinationPath "artifacts\LiveWallpaperStudio-win-x64-unsigned.zip" -Force

      - name: Upload unsigned Windows QA package
        uses: actions/upload-artifact@v7
        with:
          name: LiveWallpaperStudio-win-x64-unsigned
          path: artifacts/LiveWallpaperStudio-win-x64-unsigned.zip
          if-no-files-found: error

      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v7
        with:
          name: Loopdesk-store-msix
          path: artifacts/store/**/*.msix
          if-no-files-found: error

      - name: Upload renderer artifact
        uses: actions/upload-artifact@v7
        with:
          name: lws-renderer-windows-x64
          path: build/renderer/Release/lws-renderer.exe
          if-no-files-found: error
